name: Request
description: An idea for something new or better.
labels: [request]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The problem you're solving, with an example if you can.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
