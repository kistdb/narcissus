name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
      - name: test
        run: go test ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="narcissus_${TAG#v}_${os}_${arch}"
            mkdir -p "build/$name"
            exe=narcissus; [ "$os" = windows ] && exe=narcissus.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "build/$name/$exe" ./cmd/narcissus
            cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > checksums.txt)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## " { if (p) exit; if (index($0, v)) { p = 1; next } } p' CHANGELOG.md)
          gh release create "$TAG" dist/* --title "Narcissus $TAG" --notes "$notes" --verify-tag
