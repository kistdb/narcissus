version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Unhandled errors: errcheck already checks them, with the
        # std-error-handling preset below.
        - G104
        # A file opened by a variable path: paths come from the command line.
        - G304
        # Path traversal by taint: a CLI reads the paths its user names.
        - G703
  exclusions:
    presets:
      - std-error-handling # unchecked Close, fmt.Fprint* and os.Remove*
    rules:
      - path: _test\.go$
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kistdb/narcissus
